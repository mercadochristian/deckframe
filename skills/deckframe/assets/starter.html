<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Deckframe presentation</title>
<link rel="stylesheet" href="deckframe.css">
<script src="deckframe.js" defer></script>
<style>
  :root {
    color-scheme: dark;
    --shell: #181817;
    --paper: #f7f1e1;
    --ink: #231d19;
    --blue: #193bb5;
    --orange: #c83a22;
    --lime: #dcff75;
    --white: #fffaf0;
  }
  body { margin: 0; font: 16px system-ui, sans-serif; color: var(--paper); background: var(--shell); }
  main { width: min(100% - 32px, 1000px); margin: 24px auto; }
  h1, h2 { margin: 0; font-size: clamp(32px, 8cqw, 88px); line-height: .95; letter-spacing: -.055em; }
  p { max-width: 36ch; line-height: 1.5; }
  [data-stage] { container-type: inline-size; }
  [data-slide] { position: relative; min-height: 260px; padding: 8cqw; box-sizing: border-box; }
  .first { background: var(--paper); color: var(--ink); }
  .second { background: var(--blue); color: var(--white); }
  .token {
    display: grid; place-items: center; position: absolute; aspect-ratio: 1;
    right: 11%; bottom: 12%; width: 22%; border-radius: 12%; background: var(--orange);
    color: var(--white); transform: rotate(-14deg);
    font-weight: 800; font-size: clamp(24px, 7cqw, 80px);
  }
  .second .token {
    right: 9%; bottom: 12%; width: 31%; border-radius: 50%; transform: rotate(12deg);
    background: var(--lime); color: var(--ink);
  }
  footer, nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  footer { margin-top: 12px; }
  nav { margin-right: auto; }
  button { cursor: pointer; min-height: 40px; padding: 0 12px; font: inherit; }
  button:disabled { cursor: default; }
  button[aria-current] { background: var(--lime); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  @media (max-width: 600px) {
    [data-deckframe] { --df-aspect: 4 / 5; }
    .token { bottom: 15%; }
  }
</style>
</head>
<body>
<main data-deckframe>
  <div data-stage aria-label="Presentation">
    <section id="start" data-slide class="first" data-transition="cut">
      <h1>Start here.</h1>
      <p>Give two elements the same morph name and watch what happens when you advance.</p>
      <div class="token" data-morph="spark" aria-hidden="true">✦</div>
    </section>
    <section id="change-the-shape" data-slide class="second" data-transition="fade">
      <h2>Change the shape.</h2>
      <div class="token" data-morph="spark" aria-hidden="true">✦</div>
      <p data-step>Click Reveal or press → to show this line.</p>
    </section>
  </div>
  <footer data-controls hidden>
    <nav data-jump aria-label="Jump to slide"></nav>
    <button type="button" data-back>Back</button>
    <button type="button" data-next>Next</button>
    <button type="button" data-replay hidden>Replay</button>
  </footer>
  <div data-status role="status"></div>
</main>
</body>
</html>
